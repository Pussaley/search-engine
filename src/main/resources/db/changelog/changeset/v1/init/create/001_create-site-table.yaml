databaseChangeLog:
  - changeSet:
      id: 1
      author: pussaley
      changes:
        - createTable:
            tableName: sites
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: status
                  type: enum('INDEXING', 'INDEXED', 'FAILED')
              - column:
                  name: status_time
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(64)
                  constraints:
                    unique: true
              - column:
                  name: last_error
                  type: varchar(255)
              - column:
                  name: url
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true