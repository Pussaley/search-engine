databaseChangeLog:
  - changeSet:
      id: 3
      author: pussaley
      failOnError: true
      dbms: mysql, postgresql
      changes:
        - createTable:
            tableName: lemmas
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: site_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: lemma
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                 name: frequency
                 type: smallint
                 constraints:
                   nullable: false